[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singseq-quant-research"
version = "0.2.0"
description = "Local quantitative research with execution-aware backtesting, factor diagnostics and reproducible reports."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "SingSeq Quant Research contributors" }]
keywords = ["quantitative-finance", "backtesting", "factor-research", "a-shares", "ai-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scipy>=1.11",
  "duckdb>=1.1",
  "pyarrow>=14",
  "polars>=1.0",
  "filelock>=3.12",
]

[project.optional-dependencies]
ml = ["torch>=2.2", "scikit-learn>=1.3", "lightgbm>=4.0"]
acceleration = ["numba>=0.60"]

[project.scripts]
quant-research = "quant_sdk.research:main"

[project.urls]
Homepage = "https://quant.singseq.com"
Repository = "https://github.com/weihaoyang/singseq-quant-research"
Issues = "https://github.com/weihaoyang/singseq-quant-research/issues"

[tool.setuptools]
py-modules = ["factor_base"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant_sdk*", "factors_catalog*", "evaluation*", "research*", "deep_alpha*", "server", "server.engine*", "server.sandbox*"]
exclude = ["tests*"]
namespaces = false
